name: Pocket03
options:
  bundleIdPrefix: studio.pocket03
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_OPTIMIZATION_LEVEL: '-O'
targets:
  Pocket03:
    type: application
    platform: iOS
    sources: [Pocket03]
    info:
      path: Pocket03/Info.plist
      properties:
        UIAppFonts: [VT323-Regular.ttf]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: studio.pocket03.camera
        # Personal install. Override DEVELOPMENT_TEAM if signing with another Apple ID.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UUHHK5M7YA
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket03
        INFOPLIST_KEY_NSCameraUsageDescription: Pocket03 uses your camera to make low-resolution photos and silent videos.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save the photos and videos you choose to your photo library.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  Pocket03Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Pocket03Tests]
    dependencies:
      - target: Pocket03
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  Pocket03UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Pocket03UITests]
    dependencies:
      - target: Pocket03
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pocket03:
    build:
      targets:
        Pocket03: all
    test:
      targets: [Pocket03Tests, Pocket03UITests]
